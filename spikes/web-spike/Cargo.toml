# Phase 0 WebGPU spike harness. THROWAWAY: deleted at go/no-go.
# Own [workspace] table so the parent workspace's --workspace jobs and CI
# never see this crate.

[package]
name = "web-spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
solarxy-renderer = { path = "../../crates/solarxy-renderer" }
solarxy-core = { path = "../../crates/solarxy-core", default-features = false, features = ["serde"] }
wgpu = "27.0.1"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
cgmath = "0.18"
bytemuck = "1"
tobj = "4.0.3"
anyhow = "1"
# Backend selection for getrandom on wasm32 (via tobj -> ahash); pairs with
# the --cfg getrandom_backend="wasm_js" rustflag in .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "HtmlCanvasElement",
    "Response",
    "Performance",
    "console",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
