<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Solarxy web-spike (Phase 0)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1016; }
    #spike-canvas { width: 100vw; height: 100vh; display: block; }
    #spike-stats {
      position: fixed; top: 8px; left: 8px; padding: 4px 8px;
      font: 12px/1.4 monospace; color: #ffcc66; background: rgba(13, 16, 22, 0.7);
      pointer-events: none; white-space: pre;
    }
    #spike-unsupported {
      position: fixed; inset: 0; display: none; place-items: center;
      color: #f28779; font: 16px/1.6 monospace; text-align: center; padding: 2rem;
    }
  </style>
</head>
<body>
  <canvas id="spike-canvas"></canvas>
  <div id="spike-stats">loading…</div>
  <div id="spike-unsupported">This browser does not expose WebGPU (navigator.gpu missing).</div>
  <script type="module">
    if (!navigator.gpu) {
      document.getElementById("spike-unsupported").style.display = "grid";
      document.getElementById("spike-stats").textContent = "SPIKE_NO_WEBGPU";
      console.error("SPIKE_NO_WEBGPU");
    } else {
      const { default: init } = await import("./dist/web_spike.js");
      await init();
    }
  </script>
</body>
</html>
