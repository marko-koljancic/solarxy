# Submit Solarxy (GUI) to microsoft/winget-pkgs after each stable release.
#
# Flow: check out the repo, take the hand-authored manifest under
# `packaging/winget/manifests/k/Koljam/Solarxy/<version>/`, fill its
# `{{INSTALLER_SHA256}}` placeholder, and `wingetcreate submit` it as a PR
# to microsoft/winget-pkgs. `submit` works for both a brand-new package
# (the first 0.6.0 submission) and every later version.
#
# The manifest deliberately omits ProductCode (optional field; the WiX
# ProductCode rotates per build and winget reads it from the MSI at install
# time) — so the only release-time substitution is the SHA-256.
#
# Microsoft moderation review typically takes 3-7 days. Once merged, users
# install with `winget install Koljam.Solarxy`.
#
# Invocation:
#   - `workflow_call` — called by cargo-dist's release.yml as a reusable
#     workflow via the `post-announce-jobs` hook (see dist-workspace.toml).
#     Runs in-graph, so the GITHUB_TOKEN chain restriction that kills
#     `on: release: published` does not apply. The `plan` input carries
#     cargo-dist's dist-manifest; the tag is read from `announcement_tag`.
#   - `workflow_dispatch` — manual run against an existing release tag.
#     Checkout uses the workflow ref, so dispatching from a branch picks up
#     that branch's manifest (e.g. to re-submit after a manifest fix).
name: "Release: winget manifest"

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist dist-manifest JSON payload.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest
    env:
      # `github.event_name` in a reusable workflow reflects the CALLER's
      # event, not `workflow_call`, so mode is detected by input presence.
      # `&&` short-circuits so fromJson only runs when inputs.plan is set.
      TAG: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_tag || inputs.tag }}
      IS_PRERELEASE: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_is_prerelease || false }}
    steps:
      - name: Gate — WINGET_RELEASE_PAT present and not a prerelease
        id: gate
        shell: bash
        env:
          WINGET_RELEASE_PAT: ${{ secrets.WINGET_RELEASE_PAT }}
        run: |
          set -euo pipefail
          proceed=true
          if [ -z "$WINGET_RELEASE_PAT" ]; then
            echo "::warning::WINGET_RELEASE_PAT not set — winget submission skipped. Provision a fork PAT to enable automatic submissions."
            proceed=false
          fi
          tag="${TAG#v}"
          if [ "$IS_PRERELEASE" = "true" ] || [[ "$tag" == *-rc.* || "$tag" == *-alpha.* || "$tag" == *-beta.* ]]; then
            echo "::notice::$TAG is a prerelease — winget submission skipped."
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Checkout solarxy
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install wingetcreate
        if: steps.gate.outputs.proceed == 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # The submission opens its PR from a fork of microsoft/winget-pkgs, and
      # wingetcreate refuses to submit when it cannot fast-forward that fork
      # itself (4,185 commits behind at 0.8.2, failing with a generic "sync
      # your fork manually and try again"). Sync it here, server-side: the
      # merge-upstream API performs the same merge as the web UI's "Sync
      # fork" button, on GitHub's side, which is what sidesteps the
      # `workflow` scope a git push of upstream workflow files would need.
      # The fork is never ahead, because nothing but wingetcreate writes to
      # it, so a fast-forward always suffices and there is no conflict case.
      # The fork owner is resolved from the PAT rather than hard-coded, since
      # the fork is whichever account the credential belongs to.
      - name: Sync the winget-pkgs fork with upstream
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_RELEASE_PAT }}
        run: |
          set -euo pipefail
          fork_owner=$(gh api user -q .login)
          if ! gh api "repos/$fork_owner/winget-pkgs" > /dev/null 2>&1; then
            echo "::notice::$fork_owner has no winget-pkgs fork yet; wingetcreate will create one, which is born current."
            exit 0
          fi
          echo "Syncing $fork_owner/winget-pkgs from upstream"
          if ! gh api -X POST "repos/$fork_owner/winget-pkgs/merge-upstream" -f branch=master; then
            echo "::error::The winget-pkgs fork is stale and could not be synced server-side. The submission would fail with wingetcreate's generic wording, but the cause is the fork, not the manifest: sync $fork_owner/winget-pkgs by hand (the web UI's Sync fork button performs the same merge) and re-run this workflow."
            exit 1
          fi

      - name: Fill manifest and submit to winget-pkgs
        if: steps.gate.outputs.proceed == 'true'
        shell: pwsh
        env:
          # wingetcreate reads the token from this env var — preferred over
          # --token, which can leak the value into logs.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_RELEASE_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          $manifestDir = "packaging/winget/manifests/k/Koljam/Solarxy/$version"
          if (-not (Test-Path $manifestDir)) {
            throw "No winget manifest at $manifestDir — add the version directory before tagging."
          }
          $installerManifest = Join-Path $manifestDir 'Koljam.Solarxy.installer.yaml'

          # Download the MSI cargo-dist produced for this release and hash it.
          $msiUrl = "https://github.com/marko-koljancic/solarxy/releases/download/$env:TAG/solarxy-x86_64-pc-windows-msvc.msi"
          $msiPath = Join-Path $env:RUNNER_TEMP 'solarxy.msi'
          Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
          $sha = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash

          # Fill the manifest's single placeholder in place.
          (Get-Content $installerManifest -Raw) `
            -replace '\{\{INSTALLER_SHA256\}\}', $sha `
            | Set-Content $installerManifest -NoNewline
          Write-Host "Filled $installerManifest — SHA256=$sha"

          # Submit the manifest set as a PR to microsoft/winget-pkgs.
          ./wingetcreate.exe submit $manifestDir `
            --prtitle "Koljam.Solarxy version $version"
