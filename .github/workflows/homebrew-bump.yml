# Bump the Solarxy Homebrew tap after each stable GitHub Release.
#
# Updates both:
#   - Casks/solarxy.rb       — the GUI .dmg (cask). Bumps the version and fills
#     the two per-arch sha256 values from the `*.dmg.sha256` companion files
#     that native-bundle publishes beside each DMG.
#
#     This job used to bump the version only, because the cask carried
#     `sha256 :no_check` and reading a DMG hash would have raced the
#     native-bundle job that uploads it. Both halves of that are now fixed:
#     `custom-homebrew-bump` gains `needs: custom-native-bundle` in
#     release.yml, so the DMG and its companion exist before this runs.
#     `:no_check` was not a free simplification — with no integrity gate, a
#     failed staging step is only caught after the installed app has already
#     been removed, which is exactly how a 0.6.0 -> 0.7.0 upgrade left a
#     machine with no Solarxy at all.
#   - Formula/solarxy-cli.rb — the CLI. Bumps the version and fills the four
#     per-platform sha256 values from the `*.tar.xz.sha256` companion files
#     cargo-dist publishes next to each binary tarball.
#
# Pushes a commit directly to the tap (no PR — single-maintainer repo).
#
# Invocation:
#   - `workflow_call` — called by cargo-dist's release.yml as a reusable
#     workflow via the `post-announce-jobs` hook (see dist-workspace.toml).
#     Runs in-graph, so the GITHUB_TOKEN chain restriction that kills
#     `on: release: published` does not apply. The `plan` input carries
#     cargo-dist's dist-manifest; the tag is read from `announcement_tag`.
#   - `workflow_dispatch` — manual run against an existing release tag.
name: Homebrew bump

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist dist-manifest JSON payload.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      # `github.event_name` in a reusable workflow reflects the CALLER's
      # event, not `workflow_call`, so mode is detected by input presence.
      # `&&` short-circuits so fromJson only runs when inputs.plan is set.
      TAG: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_tag || inputs.tag }}
      IS_PRERELEASE: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_is_prerelease || false }}
    steps:
      - name: Gate — HOMEBREW_TAP_PAT present and not a prerelease
        id: gate
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail
          proceed=true
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "::warning::HOMEBREW_TAP_PAT not set — Homebrew bump skipped. Provision the secret to enable automatic tap updates."
            proceed=false
          fi
          tag="${TAG#v}"
          if [ "$IS_PRERELEASE" = "true" ] || [[ "$tag" == *-rc.* || "$tag" == *-alpha.* || "$tag" == *-beta.* ]]; then
            echo "::notice::$TAG is a prerelease — Homebrew bump skipped."
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: marko-koljancic/homebrew-solarxy
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap
          fetch-depth: 1

      - name: Bump cask + formula
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Cask — bump the version, then fill each arch's sha256 from the
          # `.dmg.sha256` companion native-bundle publishes. Ordered after
          # native-bundle via `needs:` in release.yml, so the companions are
          # already on the release when this runs.
          sed -i -E "s/^(  version )\"[^\"]*\"/\1\"${VERSION}\"/" tap/Casks/solarxy.rb
          for arch in aarch64 x86_64; do
            url="https://github.com/marko-koljancic/solarxy/releases/download/${TAG}/Solarxy-${VERSION}-${arch}.dmg.sha256"
            sha=$(curl -fsSL "$url" | awk '{print $1}')
            # A cask that cannot verify its download must not ship: bail rather
            # than fall back to :no_check.
            if [ -z "$sha" ]; then
              echo "::error::Could not read sha256 for Solarxy-${VERSION}-${arch}.dmg"
              exit 1
            fi
            case "$arch" in
              aarch64) key="arm" ;;
              x86_64)  key="intel" ;;
            esac
            sed -i -E "s/^(  sha256 ${key}:[[:space:]]+)\"[^\"]*\"/\1\"${sha}\"/;s/^([[:space:]]+${key}:[[:space:]]+)\"[^\"]*\"/\1\"${sha}\"/" tap/Casks/solarxy.rb
          done

          # Fail loudly if the cask still carries :no_check — a silently
          # unverified cask is the failure mode this job exists to prevent.
          # Anchored to a real stanza (optional indent, then `sha256 :no_check`)
          # and run over comment-stripped text: the cask *documents* why
          # :no_check was retired, so a naive substring grep matches that prose
          # and fails every release.
          if grep -v '^[[:space:]]*#' tap/Casks/solarxy.rb \
              | grep -qE '^[[:space:]]*sha256[[:space:]]+:no_check'; then
            echo "::error::Cask still carries a sha256 :no_check stanza after bump."
            exit 1
          fi

          # Both hashes must actually be present, or the sed silently no-opped
          # (e.g. someone reformatted the stanza and the pattern stopped
          # matching) and we would ship a cask pinned to the previous release's
          # checksums.
          for key in arm intel; do
            if ! grep -qE "^[[:space:]]*(sha256 )?${key}:[[:space:]]+\"[a-f0-9]{64}\"" tap/Casks/solarxy.rb; then
              echo "::error::Cask is missing a valid ${key} sha256 after bump."
              exit 1
            fi
          done

          # Formula — bump the version, then fill each platform's sha256 from
          # the cargo-dist `.tar.xz.sha256` companion file. These are global
          # release artifacts (uploaded before the announce step), so there
          # is no race with native-bundle.
          sed -i -E "s/^(  version )\"[^\"]*\"/\1\"${VERSION}\"/" tap/Formula/solarxy-cli.rb
          for triple in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            url="https://github.com/marko-koljancic/solarxy/releases/download/${TAG}/solarxy-cli-${triple}.tar.xz.sha256"
            sha=$(curl -fsSL "$url" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "::error::Could not read sha256 for solarxy-cli-${triple}.tar.xz"
              exit 1
            fi
            # Replace the sha256 on the line that follows this triple's url.
            sed -i -E "/solarxy-cli-${triple}\.tar\.xz\"/{n;s/(sha256 )\"[^\"]*\"/\1\"${sha}\"/}" tap/Formula/solarxy-cli.rb
          done

      - name: Commit and push
        if: steps.gate.outputs.proceed == 'true'
        working-directory: tap
        run: |
          git config user.name "solarxy-bot"
          git config user.email "noreply@github.com"
          git add Casks/solarxy.rb Formula/solarxy-cli.rb
          if git diff --cached --quiet; then
            echo "::notice::No changes to bump — tap already at ${TAG}."
            exit 0
          fi
          git commit -m "Bump to ${TAG}"
          git push origin HEAD
