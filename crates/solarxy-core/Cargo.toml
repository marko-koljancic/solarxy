[package]
name = "solarxy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core data types, geometry algorithms, and validation for 3D model analysis"

[features]
default = ["serialization"]

# Wasm-safe serde derives + JSON: view_config, preferences types, and the
# validation-type derives. No filesystem, no platform dirs.
serde = ["dep:serde", "dep:serde_json"]

# File IO on top of `serde`: preferences load/save (dirs + toml) and
# install-source detection. Off for wasm builds.
fs = ["serde", "dep:toml", "dep:dirs", "dep:tracing"]

# Compatibility umbrella (the historical default): serde + fs plus the
# modules that need the heavier deps (json/report, review, project_config).
serialization = [
    "serde",
    "fs",
    "dep:anyhow",
    "dep:thiserror",
    "dep:regex",
    "dep:strsim",
    "dep:sha2",
]

schemars-gen = ["dep:schemars", "serde"]

[dependencies]
cgmath = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6.0", optional = true }
tracing = { version = "0.1", optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
strsim = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
