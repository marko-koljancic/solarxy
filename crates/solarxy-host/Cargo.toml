[package]
name = "solarxy-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared host orchestration for the Solarxy shells: the per-pane render loop, the lighting chokepoint, the view-state model, and the gizmo drag solver."
publish = false

[dependencies]
# `serde` only, matching the renderer: this crate reaches preferences enums,
# view_config, the scene contract and the raycast primitive, never file IO.
solarxy-core = { path = "../solarxy-core", default-features = false, features = ["serde"] }
# `default-features = false` drops `std-fs`, which is what keeps this crate
# compiling for wasm32 alongside the web shell.
solarxy-renderer = { path = "../solarxy-renderer", default-features = false }
# The rotate drag composes and decomposes Euler rotations through the kernel.
solarxy-kernel = { path = "../solarxy-kernel" }
wgpu = "27.0.1"
cgmath = { workspace = true }
bytemuck = { version = "1.24", features = ["derive"] }
# The attribute-visualization state derives its boundary shapes here rather
# than in the shell, so the shell's DTO stays a thin re-export.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The display-defaults drift tests assert the parsed names against the enums'
# own serde names, so they need a serializer to ask what those names are.
serde_json = "1"
# The golden-capture harness lives here as an example: it drives the shared
# pane path, which is what puts the extracted orchestration under the pixel
# gate rather than beside it.
anyhow = { workspace = true }
pollster = "0.4.0"
solarxy-formats = { path = "../solarxy-formats" }
# `std-fs` for the example only: it loads a model from a path. The library
# above takes the renderer with default features off, which is what keeps this
# crate compiling for wasm32 alongside the web shell.
solarxy-renderer = { path = "../solarxy-renderer", features = ["std-fs"] }

[dev-dependencies.image]
version = "0.25.9"
default-features = false
features = ["png"]

# Deliberately ABSENT: `solarxy-graph`. The engine and the renderer meet only
# at `solarxy_core::scene::SceneDelta`, and this crate sits on the renderer's
# side of that line; both shells hold an engine now, and they hand this crate
# plain data rather than the engine itself. The gizmo's drag solver is
# graph-free for exactly this reason: it reads a pose, and the shell that owns
# the document decides where the result is addressed.
