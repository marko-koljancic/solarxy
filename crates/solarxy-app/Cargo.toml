[package]
name = "solarxy-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "winit + egui app shell for the Solarxy viewer"

[dependencies]
solarxy-core = { path = "../solarxy-core" }
solarxy-formats = { path = "../solarxy-formats" }
solarxy-renderer = { path = "../solarxy-renderer" }
# The shared host orchestration, also driving the web shell.
solarxy-host = { path = "../solarxy-host" }
# The node engine. This shell is its second host, after the web one; the
# dependency belongs here rather than on solarxy-host, which stays free of
# it so a crate beneath both shells cannot hand one an engine it has no
# use for. The engine and the renderer still never see each other: they
# meet at solarxy_core::scene::SceneDelta and nowhere else.
solarxy-graph = { path = "../solarxy-graph" }
# Reached directly for the scene file's view sidecar, which solarxy-graph
# returns but does not re-export.
solarxy-scenefile = { path = "../solarxy-scenefile" }
winit = "0.30.12"
wgpu = "27.0.1"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
egui_dock = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4.0"
bytemuck = { version = "1.24", features = ["derive"] }
rfd = "0.15"
open = "5"
time = { version = "0.3", features = [
    "local-offset",
    "formatting",
    "parsing",
    "macros",
] }
cgmath = { workspace = true }
ulid = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[dependencies.image]
version = "0.25.9"
default-features = false
features = ["png", "jpeg", "webp", "hdr"]
