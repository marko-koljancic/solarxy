[package]
name = "solarxy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI parsing and TUI interfaces for Solarxy"

[[bin]]
name = "solarxy-cli"
path = "src/bin/solarxy-cli.rs"
required-features = ["tui"]

[features]
default = ["tui", "analyzer", "updater"]
tui = ["dep:ratatui", "dep:crossterm"]
analyzer = ["dep:solarxy-formats"]
updater = ["dep:axoupdater"]

[dependencies]
solarxy-core = { path = "../solarxy-core" }
solarxy-formats = { path = "../solarxy-formats", optional = true }
cgmath = { workspace = true }
clap = { version = "4.5.53", features = ["derive"] }
anyhow = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
glob = "0.3"
ulid = { workspace = true }
sha2 = { workspace = true }
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "std"] }
toml = "0.8"
regex = { workspace = true }
ratatui = { version = "0.29.0", optional = true }
crossterm = { version = "0.28.1", optional = true }
axoupdater = { version = "0.10", features = ["blocking"], optional = true }

[package.metadata.dist]
installers = ["shell", "powershell"]
