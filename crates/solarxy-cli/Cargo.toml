[package]
name = "solarxy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLI parsing and TUI interfaces for Solarxy"

[[bin]]
name = "solarxy-cli"
path = "src/bin/solarxy-cli.rs"
required-features = ["tui"]

[features]
default = ["tui", "analyzer", "updater", "render"]
tui = ["dep:ratatui", "dep:crossterm", "dep:toml"]
analyzer = ["dep:solarxy-formats", "dep:solarxy-validate"]
updater = ["dep:axoupdater"]
# Headless rendering. On by default so `solarxy-cli render` works from every
# install channel; it is what brings the GPU stack into an otherwise pure-CPU
# binary, which is why it is a feature at all rather than a plain dependency.
render = ["dep:solarxy-render", "dep:ctrlc"]
# The live window. Off by default because it is the one thing here that opens
# a window, and a build for a machine with no display should not carry the
# code that would. The distribution build turns it on; a build without it
# answers `--watch` with a message rather than refusing to parse the flag.
watch = [
    "render",
    "dep:winit",
    "dep:wgpu",
    "dep:pollster",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
]

[dependencies]
solarxy-render = { path = "../solarxy-render", features = ["clap"], optional = true }
# Cross-platform interrupt handling. Its own tree is already vendored by other
# members, so this adds one crate rather than a dependency graph.
ctrlc = { version = "3", optional = true }
solarxy-core = { path = "../solarxy-core" }
solarxy-formats = { path = "../solarxy-formats", optional = true }
solarxy-validate = { path = "../solarxy-validate", features = ["clap"], optional = true }
cgmath = { workspace = true }
clap = { version = "4.5.53", features = ["derive"] }
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = { version = "0.29.0", optional = true, features = [
    "unstable-rendered-line-info",
] }
crossterm = { version = "0.28.1", optional = true }
# The same version solarxy-core already pins behind `fs`, so no package
# enters the lockfile and no transitive tree comes with it: the only change
# there is one edge naming this crate as a consumer. Declared directly rather
# than reached through solarxy-core because the theme files are this crate's.
toml = { version = "0.8", optional = true }
axoupdater = { version = "0.10", features = ["blocking"], optional = true }
# The live window's three, all of them already vendored for the desktop shell
# at exactly these versions, so this adds edges to the graph rather than
# packages to the lockfile. Default features on winit deliberately: its Linux
# backends load at run time that way, so a headless image can still start a
# binary that carries it.
winit = { version = "0.30.12", optional = true }
wgpu = { version = "27.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
# The window's chrome: the pass selector, the fit affordance and the zoom
# readout. The same versions the desktop shell pins, so these too add edges
# to the graph rather than packages to the lockfile. Ratified as the watch
# window's toolkit when its widget need outgrew a textured quad.
egui = { version = "0.33", optional = true }
egui-wgpu = { version = "0.33", optional = true }
egui-winit = { version = "0.33", optional = true }

[package.metadata.dist]
installers = ["shell", "powershell"]
# The live window ships. It is off in the default feature set so a plain
# `cargo build` carries no window code, and on here so the binary a person
# installs answers `--watch` with a window rather than with an explanation.
features = ["watch"]
