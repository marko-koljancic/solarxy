[package]
name = "solarxy-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "wgpu-based PBR renderer for Solarxy"

[features]
# Path-based entry points (load_model_any, load_texture, load_binary,
# LoadedModel::load, IblState::from_hdri). Off for wasm builds; the byte-fed
# APIs (upload_model, from_hdr_bytes/from_exr_bytes, Texture::from_bytes)
# are always available.
default = ["std-fs"]
std-fs = ["solarxy-formats/std-fs"]

[dependencies]
# `serde` (not the full `serialization` umbrella): the renderer reaches
# preferences enums, view_config, and validation types, never file IO.
solarxy-core    = { path = "../solarxy-core", default-features = false, features = ["serde"] }
solarxy-formats = { path = "../solarxy-formats", default-features = false }
wgpu        = "27.0.1"
cgmath      = { workspace = true }
bytemuck    = { version = "1.24", features = ["derive"] }
half        = "2.0"
tracing     = "0.1"
thiserror   = { workspace = true }

[dev-dependencies]
# Blocking device setup in the integration tests. The golden-capture harness
# used this too before it moved to `solarxy-host`; the tests still need it.
pollster = "0.4.0"
# Binary-style error handling for the two generator examples below.
anyhow = { workspace = true }
# Rasterizes the label glyph atlas in the gen_glyph_atlas example only;
# examples never compile into the wasm cdylib, so no runtime font dep.
ab_glyph = "0.2.31"

# LDR texture decode only. Radiance `hdr` and the `exr` crate moved to
# solarxy-formats with the HDRI decoders; nothing here reads them now.
[dependencies.image]
version          = "0.25.9"
default-features = false
features         = ["png", "jpeg", "webp"]
