[package]
name = "solarxy-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "3D model format loaders (OBJ, STL, PLY, glTF) for Solarxy"

[features]
# Path-based loaders (`load_model`, per-format `load_*`) and `DirResolver`.
# Off for wasm builds; the byte-first `load_*_bytes` API is always available.
default = ["std-fs"]
std-fs = []

[dependencies]
# Raw model types + kernels only; no serde/fs surface is used here.
solarxy-core = { path = "../solarxy-core", default-features = false }
thiserror = { workspace = true }
cgmath = { workspace = true }
tobj = { version = "4.0.3", default-features = false }
serde_json = "1"
stl_io = "0.7"
ply-rs-bw = "3.0.3"
# KHR_materials_unlit maps onto the per-material Unlit shading model
# (context-expansion phase 18); the extension is parse-only.
gltf = { version = "1.4", features = ["KHR_materials_unlit"] }
# Percent-decoding for glTF URIs handed to the AssetResolver (matches the
# gltf importer's own handling; already in the tree via gltf).
urlencoding = "2"
# data:-URI image payloads (embedded .gltf textures) decode through the
# same shared image path as external files; already in the tree.
base64 = "0.22"
tracing = "0.1"
# OpenEXR decode for the HDRI loaders. Moved here from solarxy-renderer,
# which no longer decodes anything itself, so the workspace dependency
# graph is unchanged and the wasm build gains no weight.
exr = "1.0"
# Texture decode for the byte-first loaders (MTL map_Kd etc.); the same
# crate/features the renderer uses, so the wasm build gains no new weight.
# `hdr` (Radiance RGBE) moved here from the renderer alongside `exr`.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "tga", "tiff", "bmp", "hdr"]
