[package]
name = "solarxy-graph"
description = "The Solarxy studio core: node-graph document, topology, cook engine, node registry, typed contexts, undo, and the engine facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
solarxy-core = { path = "../solarxy-core", default-features = false, features = ["serde"] }
solarxy-formats = { path = "../solarxy-formats", default-features = false }
solarxy-imaging = { path = "../solarxy-imaging" }
solarxy-kernel = { path = "../solarxy-kernel" }
solarxy-scenefile = { path = "../solarxy-scenefile" }
cgmath = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The OBJ+MTL export archive (decision M-9); Stored entries only, the
# same wasm-clean configuration the scenefile crate proved out.
zip = { version = "2", default-features = false }
